# Produção: docker compose up -d --build   →  http://localhost:8080
services:
  app:
    build: .
    image: pokerum:latest
    ports:
      - "${POKERUM_PORT:-8080}:8080"
    environment:
      RUST_LOG: info
      POKERUM_SEED: ${POKERUM_SEED:-0}
    volumes:
      - pokerum-data:/data
    restart: unless-stopped

volumes:
  pokerum-data:
