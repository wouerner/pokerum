# Deploy no Coolify (build pack "Docker Compose", Docker Compose Location:
# /docker-compose.coolify.yml). Imagem única: API Rust + site Vue (Dockerfile da raiz).
# Diferenças para o docker-compose.yml local:
#   - não publica porta: o domínio (https://pokerum.wouerner.dev) vai no serviço "app" no
#     painel do Coolify, e o Traefik encaminha para a porta interna 8080 (SERVICE_URL_APP_8080);
#   - variáveis editadas na aba Environment Variables (nomes do .env.example). O serviço só
#     recebe as variáveis listadas aqui;
#   - o banco é SQLite no volume nomeado pokerum-data (/data). Faça backup desse volume.
# Detalhes da instalação: docs/deploy.md.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SERVICE_URL_APP_8080: # o Coolify gera/usa o domínio do serviço
      RUST_LOG: ${RUST_LOG:-info,tower_http=info,sqlx=warn}
      # 1 = cria 2 vagas e 4 candidaturas fictícias se o banco estiver vazio (só na 1ª subida)
      POKERUM_SEED: ${POKERUM_SEED:-0}
      # vazio = sem CORS (site e API na mesma origem); "*" ou lista de origens separadas por vírgula
      POKERUM_CORS_ORIGINS: ${POKERUM_CORS_ORIGINS:-}
      # avaliações em segundo plano (motores LLM/API, quando existirem)
      POKERUM_ENGINE_CONCURRENCY: ${POKERUM_ENGINE_CONCURRENCY:-4}
      POKERUM_QUEUE_POLL_SECS: ${POKERUM_QUEUE_POLL_SECS:-15}
    volumes:
      - pokerum-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # o servidor encerra limpo com SIGTERM; dá folga para terminar requisições em curso
    stop_grace_period: 20s

volumes:
  pokerum-data:
